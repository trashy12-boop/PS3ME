# SPDX-License-Identifier: GPL-2.0-only
# Compile diagnostics for the real CLDC source, using PSL1GHT's 64-bit PPU ABI.
# The generic OS files are upstream placeholders, not a working PS3 OS port.
host_os = linux
host_arch = i386
os_family = linux
compiler = gcc
arch = c

export ENABLE_C_INTERPRETER = true
export ENABLE_C_INTERPRETER__BY = ps3_ppu.cfg
export ENABLE_INTERPRETER_GENERATOR = false
export ENABLE_INTERPRETER_GENERATOR__BY = ps3_ppu.cfg
export ENABLE_COMPILER = false
export ENABLE_COMPILER__BY = ps3_ppu.cfg
export ENABLE_TIMER_THREAD = false
export ENABLE_TIMER_THREAD__BY = ps3_ppu.cfg

LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS = +GenerateGNUCode
MakeDepsMain_generic = UnixPlatform
MakeDepsOpts_generic = -resolveVpath true

ifeq ($(IsTarget),true)
ifndef PS3DEV
$(error PS3DEV must point to the PSL1GHT SDK)
endif
os_family = generic
target_arch = ppu
override GCC_PREFIX_c = $(PS3DEV)/ppu/bin/ppu-
override LINK_FLAGS = -lm -lrt -llv2
override ASM_FLAGS = -mppc64
export GENERATE_EXECUTABLE = false
export GENERATE_EXECUTABLE__BY = ps3_ppu.cfg
export HARDWARE_LITTLE_ENDIAN = false
export HOST_LITTLE_ENDIAN = false
SUPPORTS_MONOTONIC_CLOCK = false
CPP_DEF_FLAGS += -DPOWERPC -DPS3ME_PPU -include stdint.h -I$(PS3DEV)/ppu/include
endif

MERGE_SOURCE_FILES = false
