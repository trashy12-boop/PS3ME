# SPDX-License-Identifier: GPL-2.0-only
host_os = linux
host_arch = amd64
os_family = linux
compiler = gcc
arch = c
target_arch = amd64
override CPP_DEF_FLAGS_linux = -DLINUX
override LINK_FLAGS = -m64 -no-pie -lm -lpthread -lrt $(NATIVE_VM_DIAGNOSTIC_FLAGS)
CPP_DEF_FLAGS += $(NATIVE_VM_DIAGNOSTIC_FLAGS)
override ASM_FLAGS = --64
export ENABLE_C_INTERPRETER = true
export ENABLE_C_INTERPRETER__BY = linux_c64.cfg
export ENABLE_INTERPRETER_GENERATOR = false
export ENABLE_INTERPRETER_GENERATOR__BY = linux_c64.cfg
export ENABLE_COMPILER = false
export ENABLE_COMPILER__BY = linux_c64.cfg
export ENABLE_TIMER_THREAD = true
export ENABLE_TIMER_THREAD__BY = linux_c64.cfg
LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS = +GenerateGNUCode
MERGE_SOURCE_FILES = false
